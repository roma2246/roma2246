name: status

on:
  schedule:
    - cron: "0 3 * * *" # 08:00 по Алматы
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/status.py", ".github/workflows/status.yml"]

permissions:
  contents: write

concurrency:
  group: readme-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build status SVGs
        run: python scripts/status.py
        env:
          # Без секрета STATUS_TOKEN считаются только публичные репозитории.
          GH_TOKEN: ${{ secrets.STATUS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_PRIVATE: ${{ secrets.STATUS_TOKEN != '' && '1' || '0' }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/status.svg
          git commit -m "status: обновление за $(date -u +%F)"
          git pull -q --rebase origin main
          git push
